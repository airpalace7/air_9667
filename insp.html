<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>메인 정비표 - HL9667</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <div class="title">HL9667 <span>MAINT STATUS</span></div>
  <div class="top-right">
    <div class="header-date" id="headerDate"></div>
    <button id="adminToggleBtn" class="admin-btn">관리자 모드</button>
    <nav class="tabs">
      <a href="index.html">목차</a>
      <a href="insp.html" class="active">01 메인정비표</a>
      <a href="trp.html">02 기체부품</a>
      <a href="eng1.html">03 #1엔진</a>
      <a href="eng2.html">04 #2엔진</a>
    </nav>
  </div>
</header>
<main>
  <div id="connectPanel" class="connect-panel" style="display:none">
    <div class="connect-row">
      <label>GitHub 계정<input id="ghOwner" placeholder="예: airpalace7"></label>
      <label>저장소 이름<input id="ghRepo" placeholder="예: air_9667"></label>
      <label>Personal Access Token<input id="ghToken" type="password" placeholder="repo 쓰기 권한 토큰"></label>
      <button id="ghConnectBtn">연결</button>
    </div>
    <div class="connect-hint">토큰은 이 브라우저에만 저장돼요. 발급: GitHub → Settings → Developer settings → Personal access tokens (repo 권한 체크)</div>
    <div id="connectMsg" class="connect-msg"></div>
  </div>

  <div id="masterForm" class="master-form" style="display:none"></div>

  <div id="info" class="info-bar"></div>
  <div id="content"><div class="loading">불러오는 중...</div></div>

  <div id="saveBar" class="save-bar" style="display:none">
    <button id="saveBtn">변경사항 저장 (GitHub에 커밋)</button>
    <span id="saveMsg" class="save-msg"></span>
  </div>
</main>
<script>
let DATA = null;
let FILE_SHA = null;
let ADMIN = false;

function escapeHtml(s) {
  if (s === null || s === undefined) return '';
  return String(s).replace(/[&<>"']/g, c => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[c]));
}

function hoursToStr(h) {
  if (h === null || h === undefined || isNaN(h)) return '';
  const neg = h < 0;
  h = Math.abs(h);
  const totalHours = Math.floor(h + 1e-9);
  const mins = Math.round((h - totalHours) * 60);
  return (neg ? '-' : '') + totalHours + ':' + String(mins).padStart(2, '0');
}

// "1234:56" 같은 hhhh:mm 문자열을 소수 시간(1234.9333...)으로 변환.
// 순수 숫자(예: "1234.5")를 입력해도 그대로 허용한다. 파싱 불가하면 NaN.
function parseHoursStr(s) {
  if (s === null || s === undefined) return NaN;
  s = String(s).trim();
  if (s === '' || s === '-') return NaN;
  const neg = s.startsWith('-');
  if (neg) s = s.slice(1);
  const m = s.match(/^(\d+):([0-5]?\d)$/);
  if (m) {
    const h = parseInt(m[1], 10);
    const mm = parseInt(m[2], 10);
    return (neg ? -1 : 1) * (h + mm / 60);
  }
  const f = parseFloat(s);
  return isNaN(f) ? NaN : (neg ? -1 : 1) * Math.abs(f);
}

function isoDate(d) {
  return d.toISOString().slice(0, 10);
}

function recomputeRow(row, raw) {
  // 관리자 모드에서 수정한 실제값(iso/hours)을 화면 표시용 문자열에도 동기화
  // (이걸 안 하면 관리자 모드를 껐을 때 예전 값이 그대로 보이는 불일치가 생김)
  // NEXT/REMAIN을 자동 재계산하지 않는 항목("엑셀관리")이라도 PERFORMED DATE/TIME,
  // INTERVAL DAY/TIME은 raw 입력값이므로 항상 동기화한다.
  if (row.performed_date_iso) {
    row.performed_date = row.performed_date_iso;
  }
  if (row.performed_time_hours !== null && row.performed_time_hours !== undefined && !isNaN(row.performed_time_hours)) {
    row.performed_time = hoursToStr(row.performed_time_hours);
  }
  if (row.interval_day_num !== null && row.interval_day_num !== undefined && !isNaN(row.interval_day_num)) {
    row.interval_day = String(row.interval_day_num);
  }
  if (row.interval_time_hours !== null && row.interval_time_hours !== undefined && !isNaN(row.interval_time_hours)) {
    row.interval_time = hoursToStr(row.interval_time_hours);
  }

  if (!row.recalc) return; // NEXT DUE/REMAIN은 엑셀에서 계산한 값을 그대로 유지("엑셀관리")

  let nextDateVal = null;
  if (row.interval_day_num !== null && row.interval_day_num !== undefined && row.performed_date_iso) {
    const pd = new Date(row.performed_date_iso + 'T00:00:00Z');
    if (!isNaN(pd.getTime())) {
      nextDateVal = new Date(pd.getTime() + row.interval_day_num * 86400000);
      row.next_date = isoDate(nextDateVal);
    }
  }

  let nextTimeVal = null;
  if (row.interval_time_hours !== null && row.interval_time_hours !== undefined &&
      row.performed_time_hours !== null && row.performed_time_hours !== undefined) {
    nextTimeVal = row.performed_time_hours + row.interval_time_hours;
    row.next_time = hoursToStr(nextTimeVal);
  }

  row.overdue = false;
  if (nextDateVal && raw.today) {
    const todayDate = new Date(raw.today + 'T00:00:00Z');
    const diffDays = Math.round((nextDateVal - todayDate) / 86400000);
    row.remain_day = String(diffDays);
    if (diffDays < 0) row.overdue = true;
  }

  if (nextTimeVal !== null) {
    let base = row.tsn_base === 'ac' ? raw.ac_tsn_hours
      : row.tsn_base === 'eng1' ? raw.eng1_tsn_hours
      : row.tsn_base === 'eng2' ? raw.eng2_tsn_hours
      : null;
    if (base !== null && base !== undefined) {
      const remainHours = nextTimeVal - base;
      row.remain_time = hoursToStr(remainHours);
      if (remainHours < 0) row.overdue = true;
    }
  }
}

function recomputeAll() {
  if (!DATA) return;
  DATA.sections.forEach(sec => sec.rows.forEach(r => recomputeRow(r, DATA.raw)));
}

function renderInfo() {
  const infoLabels = {
    "등록기호": "등록기호", "TSN": "A/C TSN", "L/D": "L/D CYCLE",
    "1ENG_TSN": "#1 ENG TSN", "2ENG_TSN": "#2 ENG TSN",
    "1ENG_GG_CYC": "#1 GG CYC", "2ENG_GG_CYC": "#2 GG CYC",
    "1ENG_PT_CYC": "#1 PT CYC", "2ENG_PT_CYC": "#2 PT CYC"
  };
  document.getElementById('headerDate').innerHTML =
    '기준일<strong>' + escapeHtml(DATA.info.DATE ?? '') + '</strong>';
  const infoEl = document.getElementById('info');
  infoEl.innerHTML = Object.entries(infoLabels).map(([k, label]) => `
    <div class="info-cell">
      <div class="k">${label}</div>
      <div class="v">${escapeHtml(DATA.info[k] ?? '')}</div>
    </div>
  `).join('');
}

function renderMasterForm() {
  const el = document.getElementById('masterForm');
  if (!ADMIN) { el.style.display = 'none'; return; }
  el.style.display = 'block';
  el.innerHTML = `
    <div class="master-title">기준값 수정 (비행시간 추가 시 여기 갱신)</div>
    <div class="master-row">
      <label>기준일<input type="date" id="m_today" value="${DATA.raw.today || ''}"></label>
      <label>A/C TSN<input type="text" placeholder="hhhh:mm" id="m_ac" value="${hoursToStr(DATA.raw.ac_tsn_hours)}"></label>
      <label>#1 ENG TSN<input type="text" placeholder="hhhh:mm" id="m_eng1" value="${hoursToStr(DATA.raw.eng1_tsn_hours)}"></label>
      <label>#2 ENG TSN<input type="text" placeholder="hhhh:mm" id="m_eng2" value="${hoursToStr(DATA.raw.eng2_tsn_hours)}"></label>
    </div>
  `;
  document.getElementById('m_today').addEventListener('change', e => {
    DATA.raw.today = e.target.value;
    DATA.info.DATE = e.target.value;
    onDataChanged();
  });
  document.getElementById('m_ac').addEventListener('change', e => {
    DATA.raw.ac_tsn_hours = parseHoursStr(e.target.value);
    DATA.info.TSN = hoursToStr(DATA.raw.ac_tsn_hours);
    onDataChanged();
  });
  document.getElementById('m_eng1').addEventListener('change', e => {
    DATA.raw.eng1_tsn_hours = parseHoursStr(e.target.value);
    DATA.info['1ENG_TSN'] = hoursToStr(DATA.raw.eng1_tsn_hours);
    onDataChanged();
  });
  document.getElementById('m_eng2').addEventListener('change', e => {
    DATA.raw.eng2_tsn_hours = parseHoursStr(e.target.value);
    DATA.info['2ENG_TSN'] = hoursToStr(DATA.raw.eng2_tsn_hours);
    onDataChanged();
  });
}

function renderContent() {
  const contentEl = document.getElementById('content');
  if (!DATA.sections || DATA.sections.length === 0) {
    contentEl.innerHTML = '<div class="empty">데이터가 없습니다.</div>';
    return;
  }

  contentEl.innerHTML = DATA.sections.map((sec, si) => `
    <div class="section-title">${escapeHtml(sec.title)}</div>
    <table class="insp-table">
      <thead>
        <tr>
          <th>ITEM</th><th>INTERVAL DAY</th><th>INTERVAL TIME/CYC</th>
          <th>PERFORMED DATE</th><th>PERFORMED A/C TIME</th>
          <th>NEXT DUE DATE</th><th>NEXT DUE A/C TIME</th>
          <th>REMAIN DAY</th><th>REMAIN TIME</th><th>REMARK</th>
        </tr>
      </thead>
      <tbody>
        ${sec.rows.map((r, ri) => {
          if (r.date_log) {
            // "CARGO HOOK - REMOVED DATE"처럼 제거일/재장착일 쌍을 여러 줄 기록하는 특수 행
            const header = `
              <tr>
                <td>${escapeHtml(r.item)}</td>
                <td></td><td></td>
                <td><strong>${escapeHtml(r.performed_date)}</strong></td>
                <td><strong>${escapeHtml(r.performed_time)}</strong></td>
                <td></td><td></td><td></td><td></td><td class="remark">${escapeHtml(r.remark)}</td>
              </tr>`;
            const logRows = (r.log_entries || []).map((log, li) => `
              <tr class="log-row">
                <td></td><td></td><td></td>
                <td>${ADMIN ? `<input type="date" class="cell-input" data-si="${si}" data-ri="${ri}" data-logidx="${li}" data-field="removed_date_iso" value="${log.removed_date_iso || ''}">` : escapeHtml(log.removed_date_iso || '')}</td>
                <td>${ADMIN ? `<input type="date" class="cell-input" data-si="${si}" data-ri="${ri}" data-logidx="${li}" data-field="reinstalled_date_iso" value="${log.reinstalled_date_iso || ''}">` : escapeHtml(log.reinstalled_date_iso || '')}</td>
                <td></td><td></td><td></td><td></td><td></td>
              </tr>`).join('');
            return header + logRows;
          }
          return `
          <tr class="${r.overdue ? 'overdue' : ''}">
            <td>${escapeHtml(r.item)}${r.overdue ? '<span class="badge-overdue">초과</span>' : ''}${(ADMIN && !r.recalc) ? '<span class="badge-manual" title="다음 예정일/잔여시간은 자동 계산되지 않아요. 엑셀에서 관리하세요.">엑셀관리</span>' : ''}</td>
            <td>${escapeHtml(r.interval_day)}</td>
            <td>${escapeHtml(r.interval_time)}</td>
            <td>${ADMIN && r.performed_date_editable ? `<input type="date" class="cell-input" data-si="${si}" data-ri="${ri}" data-field="performed_date_iso" value="${r.performed_date_iso || ''}">` : (ADMIN ? `<span class="locked-cell" title="다른 항목과 연동된 값이라 여기서 수정할 수 없어요.">${escapeHtml(r.performed_date)}</span>` : escapeHtml(r.performed_date))}</td>
            <td>${ADMIN && r.performed_time_editable ? `<input type="text" placeholder="hhhh:mm" pattern="-?\\d+:[0-5]?\\d" class="cell-input" data-si="${si}" data-ri="${ri}" data-field="performed_time_hours" value="${r.performed_time_hours !== null && r.performed_time_hours !== undefined ? hoursToStr(r.performed_time_hours) : ''}">` : (ADMIN ? `<span class="locked-cell" title="다른 항목과 연동된 값이라 여기서 수정할 수 없어요.">${escapeHtml(r.performed_time)}</span>` : escapeHtml(r.performed_time))}</td>
            <td>${escapeHtml(r.next_date)}</td>
            <td>${escapeHtml(r.next_time)}</td>
            <td>${escapeHtml(r.remain_day)}</td>
            <td>${escapeHtml(r.remain_time)}</td>
            <td class="remark">${ADMIN ? `<input type="text" class="cell-input" data-si="${si}" data-ri="${ri}" data-field="remark" value="${escapeHtml(r.remark || '')}">` : escapeHtml(r.remark)}</td>
          </tr>`;
        }).join('')}
      </tbody>
    </table>
  `).join('');

  if (ADMIN) {
    contentEl.querySelectorAll('.cell-input').forEach(inp => {
      inp.addEventListener('change', e => {
        const si = +e.target.dataset.si, ri = +e.target.dataset.ri, field = e.target.dataset.field;
        const row = DATA.sections[si].rows[ri];
        const raw = e.target.value;
        if (e.target.dataset.logidx !== undefined) {
          const li = +e.target.dataset.logidx;
          row.log_entries[li][field] = raw.trim() === '' ? null : raw;
        } else if (field === 'performed_time_hours') {
          row[field] = raw.trim() === '' ? null : parseHoursStr(raw);
        } else {
          row[field] = raw; // performed_date_iso, remark
        }
        recomputeAll();
        renderContent();
        renderInfo();
        markDirty();
      });
    });
  }
}

function onDataChanged() {
  recomputeAll();
  renderInfo();
  renderContent();
  markDirty();
}

function markDirty() {
  document.getElementById('saveMsg').textContent = '저장되지 않은 변경사항이 있습니다';
}

function updateStickyOffsets() {
  const header = document.querySelector('header.top');
  const info = document.getElementById('info');
  if (header) document.documentElement.style.setProperty('--header-h', header.offsetHeight + 'px');
  if (info) document.documentElement.style.setProperty('--info-h', info.offsetHeight + 'px');
}
window.addEventListener('resize', updateStickyOffsets);

async function load() {
  const res = await fetch('data/insp.json');
  DATA = await res.json();
  recomputeAll(); // 이전에 저장된 표시용 필드(performed_date 등)와 실제값 불일치를 로드 시점에 자동 보정
  renderInfo();
  renderContent();
}

/* ---------- GitHub 연동 ---------- */
function utf8_to_b64(str) {
  return btoa(unescape(encodeURIComponent(str)));
}

function ghHeaders(token) {
  return {
    'Authorization': 'Bearer ' + token,
    'Accept': 'application/vnd.github+json'
  };
}

async function ghFetchFile(owner, repo, token) {
  const url = `https://api.github.com/repos/${owner}/${repo}/contents/data/insp.json`;
  const res = await fetch(url, { headers: ghHeaders(token) });
  if (!res.ok) throw new Error('저장소/토큰을 확인하세요 (' + res.status + ')');
  const json = await res.json();
  return json.sha;
}

async function ghSaveFile(owner, repo, token, sha, content) {
  const url = `https://api.github.com/repos/${owner}/${repo}/contents/data/insp.json`;
  const res = await fetch(url, {
    method: 'PUT',
    headers: ghHeaders(token),
    body: JSON.stringify({
      message: '웹 관리자 모드에서 정비표 업데이트',
      content: utf8_to_b64(content),
      sha: sha,
      branch: 'main'
    })
  });
  if (!res.ok) {
    const err = await res.json().catch(() => ({}));
    throw new Error(err.message || ('저장 실패 (' + res.status + ')'));
  }
  const json = await res.json();
  return json.content.sha;
}

function setAdmin(on) {
  ADMIN = on;
  document.getElementById('adminToggleBtn').textContent = on ? '관리자 모드 끄기' : '관리자 모드';
  document.getElementById('adminToggleBtn').classList.toggle('active', on);
  document.getElementById('saveBar').style.display = on ? 'flex' : 'none';
  renderMasterForm();
  renderContent();
}

document.getElementById('adminToggleBtn').addEventListener('click', () => {
  if (ADMIN) {
    setAdmin(false);
    return;
  }
  const panel = document.getElementById('connectPanel');
  panel.style.display = panel.style.display === 'none' ? 'block' : 'none';
  const savedOwner = localStorage.getItem('gh_owner');
  const savedRepo = localStorage.getItem('gh_repo');
  const savedToken = localStorage.getItem('gh_token');
  if (savedOwner) document.getElementById('ghOwner').value = savedOwner;
  if (savedRepo) document.getElementById('ghRepo').value = savedRepo;
  if (savedToken) document.getElementById('ghToken').value = savedToken;
});

document.getElementById('ghConnectBtn').addEventListener('click', async () => {
  const owner = document.getElementById('ghOwner').value.trim();
  const repo = document.getElementById('ghRepo').value.trim();
  const token = document.getElementById('ghToken').value.trim();
  const msgEl = document.getElementById('connectMsg');
  msgEl.textContent = '확인 중...';
  try {
    FILE_SHA = await ghFetchFile(owner, repo, token);
    localStorage.setItem('gh_owner', owner);
    localStorage.setItem('gh_repo', repo);
    localStorage.setItem('gh_token', token);
    msgEl.textContent = '연결됨';
    document.getElementById('connectPanel').style.display = 'none';
    setAdmin(true);
  } catch (err) {
    msgEl.textContent = '오류: ' + err.message;
  }
});

document.getElementById('saveBtn').addEventListener('click', async () => {
  const owner = localStorage.getItem('gh_owner');
  const repo = localStorage.getItem('gh_repo');
  const token = localStorage.getItem('gh_token');
  const saveMsg = document.getElementById('saveMsg');
  saveMsg.textContent = '저장 중...';
  try {
    FILE_SHA = await ghSaveFile(owner, repo, token, FILE_SHA, JSON.stringify(DATA, null, 2));
    saveMsg.textContent = '저장 완료 (1분 내 반영)';
  } catch (err) {
    saveMsg.textContent = '오류: ' + err.message;
  }
});

load().then(updateStickyOffsets).catch(err => {
  document.getElementById('content').innerHTML =
    '<div class="empty">데이터를 불러오지 못했습니다: ' + err.message + '</div>';
});
</script>
</body>
</html>
